version: "3"

services:
  purchaser:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    command: -port 8080 -dbfile /data/purchases.db -ui-path /app/internal/ui/
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./internal/ui/:/app/internal/ui/
